<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMC Job Tracker — The Mold Consultant</title>
<style>
:root{
  --bg:#0e1210;--surface:#161a17;--surface2:#1e2420;--surface3:#252d28;
  --border:#2e3830;--border2:#3a4540;
  --green:#4ade80;--green-bg:#0f2318;--green-dark:#166534;
  --red:#f87171;--red-bg:#2d0f0f;--red-bd:#5a1f1f;
  --amber:#fbbf24;--amber-bg:#1c1400;
  --text:#e8ede9;--text2:#9aab9d;--text3:#5a6b5d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Calibri,'Segoe UI',sans-serif;font-size:15px;line-height:1.4;min-height:100vh}
a{color:inherit}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;background:var(--green-bg);border:1px solid var(--green-dark);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green)}
.logo-text{font-weight:700;font-size:16px}
.logo-sub{font-size:11px;color:var(--text3)}
.hdr-right{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:inherit;background:none;color:inherit;text-decoration:none}
.btn-primary{background:var(--green);color:#0a1a0e}
.btn-ghost{color:var(--text2);border-color:var(--border2)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{color:var(--red);border-color:var(--red-bd)}

.wrap{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.tile:hover{border-color:var(--border2)}
.tile.active{border-color:var(--green);background:var(--green-bg)}
.tile .n{font-size:26px;font-weight:800;line-height:1}
.tile .l{font-size:12px;color:var(--text2);margin-top:4px}
.tile.warn .n{color:var(--red)}
.tile.amber .n{color:var(--amber)}

.search{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:inherit;font-size:15px;margin-bottom:12px}
.search:focus{outline:none;border-color:var(--green)}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2)}
th.c,td.c{text-align:center}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#191e1a}
.name{font-weight:700}
.addr{font-size:12px;color:var(--text3)}
.svc{font-size:13px;color:var(--text2)}
.date{white-space:nowrap;font-size:14px}

.chk{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:96px;padding:7px 10px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid}
.chk.no{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.chk.yes{background:var(--green-bg);color:var(--green);border-color:var(--green-dark)}
.chk.na{background:var(--surface2);color:var(--text3);border-color:var(--border)}
.chk .sub{font-weight:400;font-size:12px;opacity:.9}
.row-actions{white-space:nowrap}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px}
.icon-btn:hover{color:var(--text);background:var(--surface3)}
.empty{text-align:center;padding:50px 20px;color:var(--text3)}
.hint{font-size:12px;color:var(--text3);margin-top:10px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px}
.modal h2{font-size:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
.modal-foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--border2);padding:10px 16px;border-radius:8px;display:none;z-index:60}

@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  table{background:none;border:none}
  tr{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:8px 4px}
  td{border:none;padding:5px 10px}
  td.c{display:inline-block}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <div class="logo-mark">TMC</div>
    <div><div class="logo-text">The Mold Consultant</div><div class="logo-sub">Job Tracker · Simple · <a href="full.html">Full version →</a></div></div>
  </div>
  <div class="hdr-right">
    <button class="btn btn-ghost" onclick="exportData()">⬇ Export</button>
    <button class="btn btn-ghost" onclick="importData()">⬆ Import</button>
    <button class="btn btn-primary" onclick="openJob()">+ New Job</button>
  </div>
</div>

<div class="wrap">
  <div class="tiles" id="tiles"></div>
  <input class="search" id="search" placeholder="🔍 Search name, address, or invoice #" oninput="render()">
  <div id="list"></div>
  <div class="hint">Click a red ✗ to mark it done. Click a green ✓ to undo.</div>
</div>

<!-- Job modal -->
<div class="overlay" id="jobOverlay">
  <div class="modal">
    <h2 id="jobTitle">New Job</h2>
    <div class="grid">
      <div class="full"><label>Client name *</label><input id="f-name"></div>
      <div class="full"><label>Address *</label><input id="f-address"></div>
      <div><label>Appointment date</label><input type="date" id="f-date"></div>
      <div><label>Service</label><select id="f-service"></select></div>
      <div><label>Phone</label><input id="f-phone"></div>
      <div><label>Email</label><input id="f-email"></div>
      <div class="full"><label>Invoice #</label><input id="f-invoice" placeholder="Leave blank if not invoiced yet"></div>
      <div class="full"><label>Notes</label><textarea id="f-notes" rows="3"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="delBtn" onclick="deleteJob()">Delete</button>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button class="btn btn-ghost" onclick="closeJob()">Cancel</button>
        <button class="btn btn-primary" onclick="saveJob()">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Uses the SAME saved data as the full version (key tmc_jobs_v3), so nothing is lost.
const KEY='tmc_jobs_v3';
const SERVICES=['Air Quality Test','Inspection','Clearance','Remediation','Full Protocol','Post-Remediation','Consultation'];
let jobs=[]; try{ jobs=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ jobs=[]; }
let filter='all', editId=null;

function save(){ localStorage.setItem(KEY,JSON.stringify(jobs)); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2500); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '—'; return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function today(){ return new Date().toISOString().slice(0,10); }

// One-time: work out Report / Invoice / Paid from the old status pipeline.
function upgrade(){
  let changed=false;
  jobs.forEach(j=>{
    if(j.simpleV) return;
    const st=j.status||'scheduled';
    j.reportDone = st==='report_sent' || st==='closed';
    j.invoiceDone = !!(j.invoiceNumber&&String(j.invoiceNumber).trim()) || st==='closed' || j.invoiceSub==='Sent' || j.invoiceSub==='Paid' || j.paymentStatus==='Invoiced' || j.paymentStatus==='Paid';
    j.paid = j.paymentStatus==='Paid' || j.invoiceSub==='Paid' || (st==='closed' && !j.paymentStatus);
    j.simpleV=1; changed=true;
  });
  if(changed) save();
}
// Keep the old status field roughly in sync so the Full version still makes sense.
function syncStatus(j){
  if(j.reportDone && j.invoiceDone && j.paid) j.status='closed';
  else if(j.reportDone) j.status='report_sent';
  else if(j.status==='closed'||j.status==='report_sent') j.status='report';
  j.paymentStatus = j.paid ? 'Paid' : (j.invoiceDone ? 'Invoiced' : (j.paymentStatus==='Waived'?'Waived':''));
}

const past = j => !j.date || j.date<=today();   // appointment already happened
const needsReport = j => !j.reportDone && past(j);
const needsInvoice = j => !j.invoiceDone && past(j);
const unpaid = j => j.invoiceDone && !j.paid;
const upcoming = j => j.date && j.date>today();

const FILTERS={
  all:{l:'All jobs',f:()=>true},
  report:{l:'No report yet',f:needsReport,cls:'warn'},
  invoice:{l:'No invoice yet',f:needsInvoice,cls:'warn'},
  unpaid:{l:'Invoiced, not paid',f:unpaid,cls:'amber'},
};

function renderTiles(){
  document.getElementById('tiles').innerHTML=Object.entries(FILTERS).map(([k,v])=>
    `<button class="tile ${v.cls||''} ${filter===k?'active':''}" onclick="setFilter('${k}')"><div class="n">${jobs.filter(v.f).length}</div><div class="l">${v.l}</div></button>`).join('');
}
function setFilter(k){ filter=filter===k&&k!=='all'?'all':k; render(); }

function render(){
  renderTiles();
  const q=document.getElementById('search').value.trim().toLowerCase();
  let list=jobs.filter(FILTERS[filter].f);
  if(q) list=list.filter(j=>[j.clientName,j.company,j.address,j.invoiceNumber,j.email,j.phone].filter(Boolean).join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const el=document.getElementById('list');
  if(!list.length){ el.innerHTML=`<div class="empty">${filter==='all'&&!q?'No jobs yet — click <b>+ New Job</b> or <b>Import</b>.':'Nothing here 🎉'}</div>`; return; }
  el.innerHTML=`<table><thead><tr><th>Client</th><th>Date</th><th>Service</th><th class="c">Report</th><th class="c">Invoice</th><th class="c">Paid</th><th></th></tr></thead><tbody>${
    list.map(j=>{
      const up=upcoming(j);
      const rep = j.reportDone ? `<button class="chk yes" onclick="toggleReport('${j.id}')">✓ In</button>`
                : `<button class="chk ${up?'na':'no'}" onclick="toggleReport('${j.id}')">${up?'Upcoming':'✗ Not yet'}</button>`;
      const inv = j.invoiceDone ? `<button class="chk yes" onclick="toggleInvoice('${j.id}')">✓ <span class="sub">${j.invoiceNumber?'#'+esc(j.invoiceNumber):'Sent'}</span></button>`
                : `<button class="chk ${up?'na':'no'}" onclick="toggleInvoice('${j.id}')">${up?'Upcoming':'✗ Not yet'}</button>`;
      const pd = !j.invoiceDone ? `<span class="chk na" style="cursor:default">—</span>`
                : `<button class="chk ${j.paid?'yes':'no'}" onclick="togglePaid('${j.id}')">${j.paid?'✓ Paid':'✗ Unpaid'}</button>`;
      return `<tr>
        <td><div class="name">${esc(j.clientName)}</div><div class="addr">${esc(j.address)}</div></td>
        <td class="date">${fmtDate(j.date)}</td>
        <td class="svc">${esc(j.serviceType)}</td>
        <td class="c">${rep}</td><td class="c">${inv}</td><td class="c">${pd}</td>
        <td class="row-actions"><button class="icon-btn" title="Edit" onclick="openJob('${j.id}')">✎</button></td>
      </tr>`;}).join('')
  }</tbody></table>`;
}

function get(id){ return jobs.find(j=>j.id===id); }
function toggleReport(id){ const j=get(id); j.reportDone=!j.reportDone; j.reportDoneAt=j.reportDone?today():''; syncStatus(j); save(); render(); toast(j.reportDone?'Report marked in ✓':'Report set back to not yet'); }
function toggleInvoice(id){
  const j=get(id);
  if(j.invoiceDone){ if(!confirm('Mark invoice as NOT sent for '+j.clientName+'?')) return; j.invoiceDone=false; j.paid=false; }
  else{
    const n=prompt('Invoice # for '+j.clientName+' (optional):', j.invoiceNumber||'');
    if(n===null) return;
    j.invoiceNumber=n.trim(); j.invoiceDone=true; j.invoiceDoneAt=today();
  }
  syncStatus(j); save(); render(); toast(j.invoiceDone?'Invoice marked sent ✓':'Invoice set back to not yet');
}
function togglePaid(id){ const j=get(id); j.paid=!j.paid; syncStatus(j); save(); render(); toast(j.paid?'Marked paid ✓':'Marked unpaid'); }

// Add / edit
function openJob(id){
  editId=id||null; const j=id?get(id):{};
  document.getElementById('jobTitle').textContent=id?'Edit Job':'New Job';
  document.getElementById('delBtn').style.visibility=id?'visible':'hidden';
  const sv=[...SERVICES]; if(j.serviceType&&!sv.includes(j.serviceType)) sv.push(j.serviceType);
  document.getElementById('f-service').innerHTML=sv.map(s=>`<option ${s===j.serviceType?'selected':''}>${esc(s)}</option>`).join('');
  document.getElementById('f-name').value=j.clientName||'';
  document.getElementById('f-address').value=j.address||'';
  document.getElementById('f-date').value=j.date||'';
  document.getElementById('f-phone').value=j.phone||'';
  document.getElementById('f-email').value=j.email||'';
  document.getElementById('f-invoice').value=j.invoiceNumber||'';
  document.getElementById('f-notes').value=j.notes||'';
  document.getElementById('jobOverlay').classList.add('open');
  document.getElementById('f-name').focus();
}
function closeJob(){ document.getElementById('jobOverlay').classList.remove('open'); }
function saveJob(){
  const v=id=>document.getElementById(id).value.trim();
  if(!v('f-name')||!v('f-address')){ alert('Client name and address are required.'); return; }
  const f={clientName:v('f-name'),address:v('f-address'),date:v('f-date'),serviceType:v('f-service'),phone:v('f-phone'),email:v('f-email'),invoiceNumber:v('f-invoice'),notes:v('f-notes')};
  let j;
  if(editId){ j=get(editId); Object.assign(j,f); }
  else{ j={id:Date.now().toString(),...f,status:'scheduled',reportSub:'',invoiceSub:'',reportTypes:[],paymentStatus:'',reportDone:false,invoiceDone:false,paid:false,simpleV:1,createdAt:new Date().toISOString()}; jobs.push(j); }
  if(f.invoiceNumber && !j.invoiceDone){ j.invoiceDone=true; j.invoiceDoneAt=today(); }
  syncStatus(j); save(); closeJob(); render(); toast(editId?'Job updated ✓':'Job added ✓');
}
function deleteJob(){ if(!editId||!confirm('Delete this job?')) return; jobs=jobs.filter(j=>j.id!==editId); save(); closeJob(); render(); toast('Job deleted'); }

// Backup
function exportData(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'})); a.download='tmc_jobs_'+today()+'.json'; a.click(); toast('Exported'); }
function importData(){ const i=document.createElement('input'); i.type='file'; i.accept='.json'; i.onchange=e=>{ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d)) throw 0; const ids=new Set(jobs.map(j=>j.id)); let n=0; d.forEach(j=>{ if(j&&j.id&&!ids.has(j.id)){ jobs.push(j); n++; } }); upgrade(); save(); render(); toast('Imported '+n+' job(s)'); }catch(err){ toast('Invalid file'); } }; r.readAsText(e.target.files[0]); }; i.click(); }

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeJob(); });
upgrade(); render();
</script>
</body>
</html>
